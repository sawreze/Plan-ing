<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>플잉 · 잠금화면 예시</title><style>:root,[data-theme=light]{--keycolor:#ff9000;--keycolor-ink:#a65200;--keycolor-tint:#fff1de;--on-keycolor:#2b1a0a;--surface:#ffffff;--surface-card:#f5f5f7;--ink:#111111;--ink-muted:#6b6b70;--line:#e5e5ea;--school-plan:var(--keycolor);--career-plan:#2456c9;--danger:#c8352a;--button-fill:#e8e8ed;}[data-theme=dark]{--keycolor:#ff9a1f;--keycolor-ink:#ffb347;--keycolor-tint:#3a2611;--on-keycolor:#2b1a0a;--surface:#000000;--surface-card:#1c1c1e;--ink:#ffffff;--ink-muted:#a1a1a6;--line:#2c2c2e;--school-plan:var(--keycolor);--career-plan:#7fa2ff;--danger:#ff7b6e;--button-fill:#2c2c2e;}:root{--space-1:4px;--space-2:8px;--space-4:16px;--space-6:24px;--radius-sm:8px;--radius-md:16px;--radius-pill:999px;--font-sans:"Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;}</style>
<style>/* 플잉 — 단색 알약 버튼·패널 (테두리·그림자 없음) */
.ttb-panel { background: var(--surface-card); border: 0; }

.ttb-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 52px;
  padding: 0 22px;
  border: 0;
  border-radius: var(--radius-pill);
  background: var(--button-fill);
  color: var(--ink);
  font: 600 16px/1 var(--font-sans);
  letter-spacing: -0.2px;
  cursor: pointer;
  transition: transform .12s ease, opacity .12s;
  -webkit-tap-highlight-color: transparent;
}
.ttb-btn svg { width: 22px; height: 22px; flex: none; }
.ttb-btn:active { transform: scale(.96); }
.ttb-btn:focus-visible { outline: 2px solid var(--keycolor-ink); outline-offset: 3px; }
.ttb-btn:disabled { opacity: .4; cursor: default; transform: none; }

.ttb-btn--key { background: var(--keycolor); color: var(--on-keycolor); }
.ttb-btn--icon { width: 52px; padding: 0; }
.ttb-btn--sm { height: 36px; padding: 0 14px; font-size: 14px; gap: 6px; }
.ttb-btn--sm svg { width: 18px; height: 18px; }
.ttb-btn--sm.ttb-btn--icon { width: 36px; padding: 0; }
.ttb-btn--block { display: flex; width: 100%; height: 56px; }

/* 선택된 칩·선택지 */
.ttb-btn[aria-pressed="true"] { background: var(--keycolor); color: var(--on-keycolor); }

/* 탭바 */
.ttb-tabbar {
  display: flex;
  justify-content: space-around;
  align-items: center;
  height: 64px;
  padding: 0 8px;
  border-radius: var(--radius-pill);
  background: var(--button-fill);
}
.ttb-tab {
  display: grid; place-items: center; gap: 2px;
  width: 56px; height: 52px; border-radius: var(--radius-pill);
  color: var(--ink-muted); font: 600 10px/1 var(--font-sans);
  background: none; border: 0; cursor: pointer;
}
.ttb-tab svg { width: 22px; height: 22px; }
.ttb-tab[aria-current="page"] { color: var(--keycolor-ink); }
</style>
<style>

  .login .ttb-btn svg{width:20px;height:20px;}

  .plain{background:none;border:0;padding:0;color:var(--ink);cursor:pointer;display:grid;place-items:center;}

  .ava.sm{width:24px;height:24px;font-size:11px;background:var(--surface);color:var(--ink);margin-left:-8px;}

<style>
  html{background:var(--line);} body{margin:0;min-height:100vh;display:flex;flex-direction:column;}
  .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);font-family:var(--font-sans);color:var(--ink);}
  .topbar b{font-size:18px;}
  .wall{width:auto !important;flex:1;flex-wrap:wrap;justify-content:center;align-items:center;align-content:center;background:none !important;padding:28px 16px 12px !important;}
  body.step .phone{display:none;} body.step .phone.cur{display:block;}
  .steps{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:0 16px 10px;font-family:var(--font-sans);}
  .steps button{height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--surface);color:var(--ink-muted);font:600 12px/1 var(--font-sans);cursor:pointer;}
  .steps button[aria-current="step"]{background:var(--ink);color:var(--surface);}
  .nav{display:flex;justify-content:center;align-items:center;gap:14px;padding:0 16px 28px;font-family:var(--font-sans);color:var(--ink);font-size:14px;font-weight:600;}
  body:not(.step) .nav{display:none;}
  .phone.has-tabs .scr{padding-bottom:88px;}
  .phone [data-go],.phone .tabs button{cursor:pointer;}
  @keyframes pulse{50%{transform:scale(1.12);}} .cur .pulse{animation:pulse 1s ease-in-out infinite;}
  @keyframes load{from{width:5%}to{width:100%}} .cur .loadbar i{animation:load 1.8s ease-out forwards;}
  @media (prefers-reduced-motion:reduce){.cur .pulse,.cur .loadbar i{animation:none;}}
</style>
<style>

ff66;border-radius:24px;padding:15px;color:#332e27;box-shadow:0 8px 25px #19362a16;flex:none}.lock-app{display:flex;align-items:center;gap:8px}.lock-app-icon{background:#ffac44;border-radius:9px;width:27px;height:27px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#51341a}.lock-app strong{font-size:12px}.lock-app small{margin-left:auto;font-size:9px;color:#766a5c}.lock-current{border-left:3px solid #f5d77b;padding-left:10px;margin-top:15px}.lock-current>span{font-size:10px;color:#756349}.lock-current h2{font-size:17px;line-height:1.5;margin:4px 0;overflow-wrap:anywhere}.lock-current p{font-size:11px;margin:0;color:#6e6256}.lock-agenda{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:5px}.lock-agenda-heading{display:flex;align-items:center;justify-content:space-between;gap:5px;padding-bottom:11px}.lock-agenda-heading strong{font-size:12px}.lock-agenda-heading small{font-size:9px;color:#766a5c}#lockSchedule{overflow:auto;min-height:0;flex:1}.lock-event{display:flex;align-items:center;gap:7px;padding:11px 0;border-top:1px solid #70635120;font-size:11px}.lock-event i{width:7px;height:18px;border-radius:5px;flex:none}.lock-event time{font-size:10px;color:#6e6256;flex:none}.lock-event>span{flex:1;overflow-wrap:anywhere;min-width:0}.lock-event small{font-size:8px;color:#736d62;flex:none}.lock-done>span{text-decoration:line-through;opacity:.6}.lock-empty{font-size:12px;color:#6e6256;padding:20px 0}.lock-open-app{background:#213b30ad;color:#fff4df;border:1px solid #ffffff40;border-radius:25px;min-height:42px;font:600 12px var(--font-sans);cursor:pointer;flex:none}.lock-preview-note{font-size:8px;text-align:center;margin:0;color:#fff4dfcc;flex:none}.lock-home-indicator{width:110px;height:4px;background:#fff4e7;border-radius:5px;align-self:center;margin-top:2px;flex:none}
</style><style>body{display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;box-sizing:border-box;background:#eee9e2}.lock-phone{display:block!important;position:relative;flex:none;width:360px;height:780px;max-width:100%;margin:0;overflow:hidden;border:7px solid #302d27;border-radius:48px;box-sizing:border-box}.lock-preview-note{line-height:1.5}@media(max-width:400px){body{padding:10px}.lock-phone{height:calc(100dvh - 20px);min-height:650px}}</style></head><body><div class="phone lock-phone cur" data-screen="lock-preview" data-name="잠금화면 예시">
  <div class="lock-wallpaper" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="lock-content">
    <header class="lock-status"><span>플잉</span><span class="lock-island">▣</span><span>▮▮▮ ▰</span></header>
    <div class="lock-clock"><p id="lockDate"></p><div id="lockTime">10:24</div><span>잠금화면 미리보기</span></div>
    <div class="lock-notifications">
      <section class="lock-glass"><div class="lock-app"><span class="lock-app-icon">플</span><strong>플잉</strong><small>오늘의 일정</small></div><div id="lockCurrent" class="lock-current"><span id="lockCurrentLabel"></span><h2 id="lockCurrentTitle"></h2><p id="lockCurrentTime"></p></div></section>
      <section class="lock-glass lock-agenda"><div class="lock-agenda-heading"><strong>오늘 한눈에</strong><small id="lockCount"></small></div><div id="lockSchedule"></div></section>
    </div>
    <a href="pling-app.html" class="lock-open-app" style="display:grid;place-items:center;text-decoration:none">플잉 앱 열기 ↗</a>
    <p class="lock-preview-note">고2 예시 일정 · 실제 기기 잠금화면에는 적용되지 않아요</p><div class="lock-home-indicator" aria-hidden="true"></div>
  </div>
</div><script>const $=s=>document.querySelector(s);
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text)e.textContent=text;return e;}
function minutes(s){return Number(s.slice(0,2))*60+Number(s.slice(3));}
function seoulNow(){const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());const v=Object.fromEntries(p.map(x=>[x.type,x.value]));return {date:v.year+'-'+v.month+'-'+v.day,minute:Number(v.hour)*60+Number(v.minute)};}
const examples=[['08:30','09:00','영어 단어 복습','#b8c9ee'],['10:00','11:30','수학 문제 풀이','#f2b6a0'],['13:00','14:00','국어 비문학 읽기','#d6c0e5'],['15:00','16:30','탐구 개념 정리','#aedce0'],['18:00','19:00','저녁과 휴식','#e9d7b5'],['19:30','21:00','수학 학원 복습','#f2b6a0'],['21:00','21:30','내일 준비하기','#b5dac7']];
let events=[];
function refresh(){events=examples.map(v=>({date:seoulNow().date,start:v[0],end:v[1],title:v[2],color:v[3],done:false}));renderLockPreview();}
  function renderLockPreview(){
    var now=new Date(),info=seoulNow();
    $('#lockDate').textContent=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'long',day:'numeric',weekday:'long'}).format(now);
    $('#lockTime').textContent=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(now);
    var todays=events.filter(function(v){return v.date===info.date;}).sort(function(a,b){return minutes(a.start)-minutes(b.start);});
    var remaining=todays.filter(function(v){return !v.done&&minutes(v.end)>info.minute;});
    var focus=remaining[0];$('#lockCount').textContent='오늘 '+todays.length+'개 · 완료 '+todays.filter(function(v){return v.done;}).length+'개';
    $('#lockCurrentLabel').textContent=focus?(minutes(focus.start)<=info.minute?'지금 하고 있는 일정':'다음 일정'):'오늘의 마무리';
    $('#lockCurrentTitle').textContent=focus?focus.title:(todays.length?'오늘도 수고했어 🌙':'오늘은 여유로운 하루 🌿');
    $('#lockCurrentTime').textContent=focus?focus.start+' – '+focus.end:(todays.length?'남은 시간이 정해진 일정은 없어요.':'플잉에서 오늘의 계획을 만들어보세요.');
    $('#lockCurrent').style.borderLeftColor=focus?focus.color:'#f5d77b';
    var list=$('#lockSchedule');list.replaceChildren();
    if(!todays.length)list.appendChild(el('p','lock-empty','아직 오늘 일정이 없어요.'));
    todays.forEach(function(v){var row=el('div','lock-event'+(v.done?' lock-done':''));var dot=el('i');dot.style.background=v.color;var time=el('time','',v.start);var name=el('span','',v.title);var status=el('small','',v.done?'완료':minutes(v.end)<=info.minute?'지난 일정':'');row.append(dot,time,name,status);list.appendChild(row);});
  }

refresh();setInterval(refresh,60000);</script></body></html>
