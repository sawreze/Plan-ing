name: pling
description: "플잉 - ADHD를 위한 다정한 일정·공부 메이트"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/

# 1번 앱 아이콘. 실행: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: tool/app-icon.png
  remove_alpha_ios: true
