<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1190" viewBox="0 0 1440 1190" role="img" aria-labelledby="title desc"><title id="title">플잉 백엔드 아키텍처 제안</title><desc id="desc">앱, 관리형 인증, API 서버, PostgreSQL, 알림 워커, Gemini와 APNs의 연결</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#807465"/></marker></defs><rect width="1440" height="1190" fill="#faf7f1"/><g font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif">
<text x="60" y="66" font-size="34" fill="#3a3028" font-weight="800" text-anchor="start">플잉 · 백엔드 아키텍처</text>
<text x="60" y="102" font-size="18" fill="#8b7560" font-weight="500" text-anchor="start">추천안  |  API 1개 + 알림 워커 1개 + PostgreSQL  |  2026.11.17</text>
<rect x="60" y="150" width="610" height="128" rx="22" fill="#fff0d9" stroke="#e0d5c7" stroke-width="2"/>
<text x="84" y="187" font-size="23" fill="#3a3028" font-weight="750" text-anchor="start">플잉 앱 · 기존 디자인 유지</text>
<text x="84" y="219" font-size="17" fill="#756858" font-weight="500" text-anchor="start">화면 · 타이머 표시 · 마스코트 애니메이션</text>
<text x="84" y="245" font-size="17" fill="#756858" font-weight="500" text-anchor="start">시작은 ▶ 클릭 후 · 저장은 인증된 API로</text>
<rect x="955" y="150" width="420" height="128" rx="22" fill="#ffffff" stroke="#e0d5c7" stroke-width="2"/>
<text x="979" y="187" font-size="23" fill="#3a3028" font-weight="750" text-anchor="start">관리형 인증</text>
<text x="979" y="219" font-size="17" fill="#756858" font-weight="500" text-anchor="start">Google · Apple · 이메일</text>
<text x="979" y="245" font-size="17" fill="#756858" font-weight="500" text-anchor="start">예: Supabase Auth</text>
<path d="M 670 199 L 955 199" fill="none" stroke="#807465" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="725" y="187" font-size="15" fill="#766650" font-weight="500" text-anchor="start">로그인 / 인증 토큰</text>
