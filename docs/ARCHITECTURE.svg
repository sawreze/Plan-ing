<text x="384" y="472" font-size="19" fill="#3a3028" font-weight="700" text-anchor="start">집중 / 코인</text>
<text x="384" y="499" font-size="15" fill="#7d6b57" font-weight="500" text-anchor="start">세션 상태 · 5코인 원장</text>
<rect x="655" y="442" width="267" height="80" rx="12" fill="#f6f1e9"/>
<text x="669" y="472" font-size="19" fill="#3a3028" font-weight="700" text-anchor="start">설문 / 크루</text>
<text x="669" y="499" font-size="15" fill="#7d6b57" font-weight="500" text-anchor="start">유형 분류 · 가입 권한</text>
<rect x="85" y="538" width="267" height="80" rx="12" fill="#f6f1e9"/>
<text x="99" y="568" font-size="19" fill="#3a3028" font-weight="700" text-anchor="start">AI 대화</text>
<text x="99" y="595" font-size="15" fill="#7d6b57" font-weight="500" text-anchor="start">오늘 일정 · 변경 제안</text>
<rect x="370" y="538" width="267" height="80" rx="12" fill="#f6f1e9"/>
<text x="384" y="568" font-size="19" fill="#3a3028" font-weight="700" text-anchor="start">사용자 / 설정</text>
<text x="384" y="595" font-size="15" fill="#7d6b57" font-weight="500" text-anchor="start">프로필 · 테마 · 알림</text>
<rect x="655" y="538" width="267" height="80" rx="12" fill="#f6f1e9"/>
<text x="669" y="568" font-size="19" fill="#3a3028" font-weight="700" text-anchor="start">알림 예약</text>
<text x="669" y="595" font-size="15" fill="#7d6b57" font-weight="500" text-anchor="start">계획과 함께 예약 저장</text>
<rect x="1020" y="386" width="355" height="172" rx="22" fill="#f0eafa" stroke="#e0d5c7" stroke-width="2"/>
<text x="1044" y="423" font-size="23" fill="#3a3028" font-weight="750" text-anchor="start">Gemini</text>
<text x="1044" y="455" font-size="17" fill="#756858" font-weight="500" text-anchor="start">따뜻한 공부 고민 대화</text>
<text x="1044" y="481" font-size="17" fill="#756858" font-weight="500" text-anchor="start">구조화된 일정 변경 제안</text>
<text x="1044" y="507" font-size="17" fill="#756858" font-weight="500" text-anchor="start">확정 저장은 서버가 담당</text>
<path d="M 960 473 L 1020 473" fill="none" stroke="#807465" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="976" y="458" font-size="15" fill="#766650" font-weight="500" text-anchor="start">호출</text>
<rect x="60" y="778" width="900" height="170" rx="22" fill="#eaf3ed" stroke="#b5cdbf" stroke-width="2"/>
<text x="84" y="815" font-size="23" fill="#3a3028" font-weight="750" text-anchor="start">PostgreSQL · 데이터의 기준</text>
<text x="84" y="847" font-size="17" fill="#756858" font-weight="500" text-anchor="start">사용자 · 일정 · 목표 · 설문 · 크루 · 집중 세션</text>
<text x="84" y="873" font-size="17" fill="#756858" font-weight="500" text-anchor="start">보상 원장: 같은 계획 +5코인 1회 · 중복 키로 보장</text>
<text x="84" y="899" font-size="17" fill="#756858" font-weight="500" text-anchor="start">알림 예약: 기한 · 계획 버전 · 상태 · 발송 시도</text>
<path d="M 510 657 L 510 778" fill="none" stroke="#807465" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="535" y="719" font-size="15" fill="#766650" font-weight="500" text-anchor="start">조회 / 트랜잭션 저장</text>
<rect x="1020" y="690" width="355" height="144" rx="22" fill="#ffffff" stroke="#e0d5c7" stroke-width="2"/>
<text x="1044" y="727" font-size="23" fill="#3a3028" font-weight="750" text-anchor="start">알림 워커</text>
<text x="1044" y="759" font-size="17" fill="#756858" font-weight="500" text-anchor="start">DB에서 기한 도래 작업 선점</text>
<text x="1044" y="785" font-size="17" fill="#756858" font-weight="500" text-anchor="start">최신 계획·알림 설정 재확인</text>
<text x="1044" y="811" font-size="17" fill="#756858" font-weight="500" text-anchor="start">실패 시 기록 · 재시도</text>
<path d="M 960 856 L 990 856 L 990 765 L 1020 765" fill="none" stroke="#807465" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="968" y="746" font-size="15" fill="#766650" font-weight="500" text-anchor="start">작업</text>
<rect x="1020" y="938" width="355" height="110" rx="22" fill="#eaf1fc" stroke="#e0d5c7" stroke-width="2"/>
<text x="1044" y="975" font-size="23" fill="#3a3028" font-weight="750" text-anchor="start">APNs · iOS 푸시</text>
<text x="1044" y="1007" font-size="17" fill="#756858" font-weight="500" text-anchor="start">기기 토큰으로 발송</text>
<path d="M 1198 834 L 1198 938" fill="none" stroke="#807465" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="1210" y="887" font-size="15" fill="#766650" font-weight="500" text-anchor="start">계획 시작 / 미리 알림</text>
<path d="M 1375 990 L 1411 990 L 1411 132 L 365 132 L 365 150" fill="none" stroke="#807465" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="1060" y="121" font-size="15" fill="#766650" font-weight="500" text-anchor="start">사용자 기기로 알림 전달</text>
<text x="60" y="1011" font-size="19" fill="#3a3028" font-weight="650" text-anchor="start">AI 변경: 제안 → 사용자 확인 → 버전·시간 겹침 검사 → 저장</text>
<text x="60" y="1050" font-size="19" fill="#3a3028" font-weight="650" text-anchor="start">코인: 완료 확인 → 수령 요청 → 원장 1회 기록 → 잔액 반환</text>
<text x="60" y="1102" font-size="16" fill="#8b7560" font-weight="500" text-anchor="start">구현 전 설계안. iOS를 전제로 APNs를 표시했으며 앱 플랫폼에 따라 푸시 어댑터를 조정합니다.</text>
<text x="60" y="1132" font-size="16" fill="#8b7560" font-weight="500" text-anchor="start">타이머 계산·완료 검증은 서버 기준으로 복원하고, 앱은 화면의 초 단위 표시를 담당합니다.</text>
</g></svg>