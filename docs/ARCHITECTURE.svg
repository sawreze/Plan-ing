<text x="355" y="322" font-size="15" fill="#766650" font-weight="500" text-anchor="start">HTTPS · 토큰</text>
<path d="M 1165 278 L 1165 319 L 855 319 L 855 350" fill="none" stroke="#807465" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="1020" y="310" font-size="15" fill="#766650" font-weight="500" text-anchor="start">토큰 서명 검증</text>
<rect x="60" y="350" width="900" height="307" rx="24" fill="#fff" stroke="#eaa964" stroke-width="2.5"/>
<text x="85" y="388" font-size="25" fill="#3a3028" font-weight="750" text-anchor="start">API 서버 · TypeScript / NestJS</text>
<text x="85" y="418" font-size="17" fill="#8b7560" font-weight="500" text-anchor="start">권한 검증 → 기능 모듈 → 트랜잭션 · 버전 검사</text>
<rect x="85" y="442" width="267" height="80" rx="12" fill="#f6f1e9"/>
