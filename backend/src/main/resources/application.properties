spring.application.name=pling-backend
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pling}
spring.datasource.username=${DB_USER:${user.name}}
spring.datasource.password=${DB_PASSWORD:}
# 운영: 관리형 인증(예: Supabase Auth)의 JWKS·issuer·audience
pling.auth.jwks-url=${AUTH_JWKS_URL:}
pling.auth.issuer=${AUTH_ISSUER:}
pling.auth.audience=${AUTH_AUDIENCE:}
# 로컬 개발/에뮬레이터 전용 HS256 비밀값(32자 이상). 설정하면 /dev/token 이 열린다. 운영에서는 비워 둔다.
pling.auth.dev-secret=${AUTH_DEV_SECRET:}
pling.cors-origins=${CORS_ORIGINS:}
